<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tiendita</title>
  <style>
    :root {
      --fondo: #faf7f2;
      --verde: #1f4d3a;
      --verde-claro: #e3efe8;
      --naranja: #e8833a;
      --texto: #2b2b2b;
      --borde: #e4ddd2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fondo); color: var(--texto);
    }
    .barra {
      background: var(--verde); color: #fff;
      padding: 18px 24px; display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 8px;
    }
    .barra h1 { margin: 0; font-size: 1.5rem; letter-spacing: .5px; }
    .barra span { font-size: .9rem; opacity: .85; }
    .contenedor { max-width: 960px; margin: 28px auto; padding: 0 16px; }

    .panel {
      background: #fff; border: 1px solid var(--borde); border-radius: 14px;
      padding: 20px; margin-bottom: 24px;
    }
    .panel h2 { margin: 0 0 14px; font-size: 1.05rem; color: var(--verde); }
    .fila { display: flex; gap: 12px; flex-wrap: wrap; }
    .campo { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 6px; }
    .campo label { font-size: .85rem; color: #666; }
    .campo input {
      padding: 11px 12px; border: 1.5px solid var(--borde); border-radius: 8px;
      font-size: 15px; background: var(--fondo);
    }
    .campo input:focus { outline: none; border-color: var(--verde); }
    #add-btn {
      align-self: flex-end; padding: 12px 26px; border: none; border-radius: 8px;
      background: var(--naranja); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    #add-btn:hover { background: #d4722a; }
    #mensaje { margin-top: 10px; min-height: 18px; font-size: 13px; color: #b3261e; }

    .resumen { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
    .dato {
      flex: 1; min-width: 160px; background: var(--verde-claro);
      border-radius: 12px; padding: 14px 18px;
    }
    .dato small { color: #4a6b5a; display: block; }
    .dato strong { font-size: 1.5rem; color: var(--verde); }

    #product-list {
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    }
    .producto {
      background: #fff; border: 1px solid var(--borde); border-radius: 14px;
      padding: 16px; display: flex; flex-direction: column; gap: 6px;
      border-top: 5px solid var(--naranja);
    }
    .producto .id { font-size: .75rem; color: #888; }
    .producto .nombre { font-weight: 600; font-size: 1.1rem; word-break: break-word; }
    .producto .precio { font-size: 1.4rem; color: var(--verde); font-weight: 700; }
    .delete-btn {
      margin-top: 8px; background: transparent; color: #b3261e;
      border: 1.5px solid #b3261e; border-radius: 8px; padding: 8px; cursor: pointer;
    }
    .delete-btn:hover { background: #b3261e; color: #fff; }
    .vacio { grid-column: 1 / -1; text-align: center; padding: 30px; color: #888;
      border: 2px dashed var(--borde); border-radius: 14px; }
    footer { text-align: center; padding: 24px; color: #888; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="barra">
    <h1>Mi Tiendita</h1>
    <span>Marcos Aguirre González · UTT</span>
  </div>

  <div class="contenedor">
    <section class="panel">
      <h2>Agregar un artículo</h2>
      <div class="fila">
        <div class="campo">
          <label for="product-name">Nombre</label>
          <input type="text" id="product-name" placeholder="Ej. Cuaderno">
        </div>
        <div class="campo">
          <label for="product-price">Precio ($)</label>
          <input type="number" id="product-price" placeholder="Ej. 25" min="0" step="0.01">
        </div>
        <button id="add-btn">Agregar</button>
      </div>
      <div id="mensaje"></div>
    </section>

    <section class="resumen">
      <div class="dato"><small>Artículos</small><strong id="total-articulos">0</strong></div>
      <div class="dato"><small>Valor total</small><strong id="total-valor">$0</strong></div>
    </section>

    <section id="product-list"></section>
  </div>

  <footer>© 2026 · Actividad de Docker y despliegue en la nube</footer>

  <script>
    const KEY = "tiendita_articulos";
    let productos = [];
    let siguienteId = 1;

    try {
      productos = JSON.parse(localStorage.getItem(KEY)) || [];
      siguienteId = productos.reduce((m, p) => Math.max(m, p.id), 0) + 1;
    } catch (e) { productos = []; }

    const lista = document.getElementById("product-list");
    const inputNombre = document.getElementById("product-name");
    const inputPrecio = document.getElementById("product-price");
    const mensaje = document.getElementById("mensaje");

    function guardar() {
      try { localStorage.setItem(KEY, JSON.stringify(productos)); } catch (e) {}
    }

    function render() {
      lista.innerHTML = "";
      if (productos.length === 0) {
        lista.innerHTML = '<div class="vacio">Aún no hay artículos. ¡Agrega el primero!</div>';
      }
      productos.forEach(p => {
        const card = document.createElement("article");
        card.className = "producto";
        card.innerHTML = `<span class="id">#${p.id}</span>
          <span class="nombre"></span>
          <span class="precio">$${p.precio}</span>
          <button class="delete-btn" data-id="${p.id}">Eliminar</button>`;
        card.querySelector(".nombre").textContent = p.nombre; // evita inyectar HTML
        lista.appendChild(card);
      });
      document.getElementById("total-articulos").textContent = productos.length;
      const total = productos.reduce((s, p) => s + p.precio, 0);
      document.getElementById("total-valor").textContent = "$" + total.toFixed(2);
    }

    document.getElementById("add-btn").addEventListener("click", () => {
      const nombre = inputNombre.value.trim();
      const precio = parseFloat(inputPrecio.value);
      if (!nombre || isNaN(precio) || precio < 0) {
        mensaje.textContent = "Escribe un nombre y un precio válido.";
        return;
      }
      productos.push({ id: siguienteId++, nombre, precio });
      guardar(); render();
      inputNombre.value = ""; inputPrecio.value = ""; mensaje.textContent = "";
    });

    lista.addEventListener("click", (e) => {
      if (e.target.classList.contains("delete-btn")) {
        const id = Number(e.target.dataset.id);
        productos = productos.filter(p => p.id !== id);
        guardar(); render();
      }
    });

    render();
  </script>
</body>
</html>
